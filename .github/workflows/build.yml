name: Build NoScroll IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and build assets
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build --if-present
            npx cap sync ios || true
          fi

      - name: Install CocoaPods if needed
        run: |
          PODFILE=$(find . -maxdepth 3 -name "Podfile" | head -n 1)
          if [ -n "$PODFILE" ]; then
            POD_DIR=$(dirname "$PODFILE")
            (cd "$POD_DIR" && pod install --repo-update)
          fi

      - name: Build unsigned app
        run: |
          WORK_PATH=$(find . -maxdepth 3 -name "*.xcworkspace" ! -path "*/project.xcworkspace/*" | head -n 1)
          if [ -n "$WORK_PATH" ]; then
            SCHEME=$(xcodebuild -workspace "$WORK_PATH" -list -json | python3 -c "import sys, json; schemes=[s for s in json.load(sys.stdin)['workspace']['schemes'] if 'Test' not in s and 'Pods' not in s]; print(schemes[0])")
            xcodebuild -workspace "$WORK_PATH" -scheme "$SCHEME" -configuration Debug -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""
          else
            PROJ_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
            SCHEME=$(xcodebuild -project "$PROJ_PATH" -list -json | python3 -c "import sys, json; schemes=[s for s in json.load(sys.stdin)['project']['schemes'] if 'Test' not in s]; print(schemes[0])")
            xcodebuild -project "$PROJ_PATH" -scheme "$SCHEME" -configuration Debug -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r NoScroll.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NoScroll-IPA
          path: NoScroll.ipa
